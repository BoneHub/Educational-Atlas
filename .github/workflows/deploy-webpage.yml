# Publishes the static site in webpage/ to GitHub Pages.
#
# Every run first rebuilds webpage/data/manifest.json from the Hugging Face
# dataset and commits it if it changed, so the published page always lists what
# the dataset actually contains. Downloads themselves are served by Hugging
# Face; the site only ships the manifest and the viewer meshes (webpage/Mesh/).
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: Deploy webpage

on:
  push:
    branches: [main]
    paths:
      - "webpage/**"
      - "scripts/build_manifest.py"
      - ".github/workflows/deploy-webpage.yml"
  workflow_dispatch:

permissions:
  contents: write # to commit the regenerated manifest
  pages: write
  id-token: write

# Let a running deployment finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Reads the dataset file tree over the Hugging Face API (standard library
      # only, so no dependencies to install).
      - name: Rebuild the manifest from Hugging Face
        run: python3 scripts/build_manifest.py

      # A push made with GITHUB_TOKEN does not start another workflow run, so
      # committing the manifest here cannot loop back into this workflow.
      - name: Commit the manifest if it changed
        run: |
          if git diff --quiet -- webpage/data/manifest.json; then
            echo "Manifest is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update bone manifest from Hugging Face" -- webpage/data/manifest.json
          git push origin HEAD:${{ github.ref_name }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload webpage as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webpage

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
