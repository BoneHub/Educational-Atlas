# Publishes the static site in webpage/ to GitHub Pages.
#
# Downloads are served by the Hugging Face dataset; the site only ships the
# manifest (webpage/data/manifest.json) and the viewer meshes (webpage/Mesh/).
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: Deploy webpage

on:
  push:
    branches: [main]
    paths:
      - "webpage/**"
      - ".github/workflows/deploy-webpage.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload webpage as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webpage

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
